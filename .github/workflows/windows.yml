name: Windows portable build
on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
      - name: Build and smoke-test Windows application
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HiJson-Windows-x64
          path: dist/HiJson-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
